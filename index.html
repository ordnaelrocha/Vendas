<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cocadas</title>
<style>
:root{--bg:#fff8ee;--card:#fff;--ink:#3b2a1a;--mut:#8a7560;--pri:#c8741a;--ok:#2e8b57;--bad:#d64545;--bd:#ecdcc4}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:50px}
header{background:var(--pri);color:#fff;padding:14px 16px;font-size:20px;font-weight:700}
nav{display:flex;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--bd);z-index:5}
nav button{flex:1;padding:12px 4px;border:0;background:none;font-size:14px;color:var(--mut);font-weight:600}
nav button.on{color:var(--pri);border-bottom:3px solid var(--pri)}
main{padding:12px;max-width:640px;margin:auto}
.sec{display:none}.sec.on{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.grid .card{margin:0}
.full{grid-column:1/-1}
.card small{color:var(--mut);display:block;font-size:12px}
.card b.v{font-size:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{padding:11px;border:0;border-radius:8px;background:var(--pri);color:#fff;font-weight:700;font-size:15px;margin-top:10px;width:100%}
.btn.sm{width:auto;padding:8px 12px;font-size:13px;margin-top:8px}
.btn.green{background:var(--ok)}.btn.red{background:var(--bad)}.btn.gray{background:#8a7560}
.tag{padding:3px 8px;border-radius:20px;font-size:12px;font-weight:700;color:#fff}
.tag.ok{background:var(--ok)}.tag.pend{background:var(--bad)}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}
.pag{font-size:12px;color:var(--mut);margin-top:4px}
.pag span{color:var(--bad);margin-left:6px;cursor:pointer}
.prev{margin-top:8px;font-weight:700}
.dia{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--bd);font-size:14px}
.vazio{text-align:center;color:var(--mut);padding:20px}
</style>
</head><body>
<header>🥥 Controle de Cocadas</header>
<nav>
<button class="on" onclick="aba('resumo',this)">Resumo</button>
<button onclick="aba('vendas',this)">Vendas</button>
<button onclick="aba('pegas',this)">Estoque</button>
<button onclick="aba('clientes',this)">Clientes</button>
</nav>
<main>

<section id="resumo" class="sec on">
<div class="grid" id="cards"></div>
<div class="card"><b>Últimos 7 dias</b><div id="dias"></div></div>
<div class="card"><b>Ajustes</b>
<label>Preço de cada cocada (R$)</label>
<input id="precoPadrao" type="number" step="0.01" inputmode="decimal" onchange="setPreco()">
<div class="row"><button class="btn gray sm" onclick="gerarBackup()">Gerar backup</button><button class="btn gray sm" onclick="restaurar()">Restaurar</button></div>
<textarea id="bk" rows="3" placeholder="Backup: gere e copie. Para restaurar, cole aqui e toque em Restaurar." style="margin-top:8px"></textarea>
<button class="btn red sm" onclick="limparTudo()">Apagar tudo</button>
</div>
</section>

<section id="vendas" class="sec">
<div class="card"><b>Nova venda</b>
<label>Data</label><input id="vData" type="date">
<label>Vendi para quem?</label><input id="vCliente" list="listaClientes" placeholder="Nome do cliente">
<datalist id="listaClientes"></datalist>
<div class="row">
<div><label>Quantidade</label><input id="vQtd" type="number" inputmode="numeric" oninput="calcPrev()"></div>
<div><label>Valor cada (R$)</label><input id="vPreco" type="number" step="0.01" inputmode="decimal" oninput="calcPrev()"></div>
</div>
<label>Já pagou (R$)</label><input id="vPago" type="number" step="0.01" inputmode="decimal" oninput="calcPrev()">
<button class="btn gray sm" onclick="pagouTudo()">Pagou tudo</button>
<label>Observação (opcional)</label><input id="vObs">
<div class="prev" id="prev"></div>
<button class="btn" onclick="addVenda()">Registrar venda</button>
</div>
<div class="row">
<input id="busca" placeholder="Buscar cliente..." oninput="renderVendas()">
<select id="filtro" onchange="renderVendas()"><option value="">Todas</option><option value="pend">Pendentes</option><option value="pago">Pagas</option></select>
</div>
<div id="listaVendas" style="margin-top:10px"></div>
</section>

<section id="pegas" class="sec">
<div class="card" id="estCard"></div>
<div class="card"><b>Peguei mais cocadas</b>
<label>Data</label><input id="pData" type="date">
<div class="row">
<div><label>Quantidade</label><input id="pQtd" type="number" inputmode="numeric"></div>
<div><label>Valor cada (R$)</label><input id="pPreco" type="number" step="0.01" inputmode="decimal"></div>
</div>
<button class="btn green" onclick="addPega()">Adicionar ao estoque</button>
</div>
<div id="listaPegas"></div>
</section>

<section id="clientes" class="sec">
<div id="listaClientesCards"></div>
</section>

</main>
<script>const KEY='cocadas_v1';
let db=carregar();
let cliCache=[];
function carregar(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.pegas&&d.vendas)return d}catch(e){}return{preco:12,pegas:[],vendas:[]}}
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const r2=n=>Math.round(n*100)/100;
const brl=n=>r2(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=s=>{const v=parseFloat(String(s).replace(',','.'));return isNaN(v)?0:v};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dataOff(i){const d=new Date();d.setDate(d.getDate()-i);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
const hoje=()=>dataOff(0);
const fd=s=>s?s.split('-').reverse().join('/'):'';
const totalV=v=>r2(v.qtd*v.preco);
const pagoV=v=>r2(v.pags.reduce((a,p)=>a+p.valor,0));
const faltaV=v=>r2(totalV(v)-pagoV(v));

function stats(){
const s={pegas:0,valorPego:0,vendidas:0,vendido:0,recebido:0};
db.pegas.forEach(p=>{s.pegas+=p.qtd;s.valorPego+=p.qtd*p.preco});
db.vendas.forEach(v=>{s.vendidas+=v.qtd;s.vendido+=totalV(v);s.recebido+=pagoV(v)});
s.estoque=s.pegas-s.vendidas;
s.falta=r2(s.vendido-s.recebido);
s.estoqueValor=r2(s.estoque*db.preco);
const h=hoje();
s.hojeQtd=0;s.hojeVal=0;
db.vendas.filter(v=>v.data===h).forEach(v=>{s.hojeQtd+=v.qtd;s.hojeVal+=totalV(v)});
return s;
}

function card(t,v,cls,full){return '<div class="card'+(full?' full':'')+'"><small>'+t+'</small><b class="v '+(cls||'')+'">'+v+'</b></div>'}

function renderCards(){
const s=stats();
$('cards').innerHTML=
card('Em estoque (cocadas)',s.estoque)+
card('Peguei no total',s.pegas)+
card('Vendidas',s.vendidas)+
card('Valor que peguei',brl(s.valorPego))+
card('Total vendido',brl(s.vendido))+
card('Já recebi',brl(s.recebido),'ok-t')+
card('Falta receber',brl(s.falta),s.falta>0?'bad-t':'')+
card('Estoque em R$',brl(s.estoqueValor))+
card('Hoje',s.hojeQtd+' vendidas · '+brl(s.hojeVal),'',true);
}

function renderDias(){
let h='';
for(let i=0;i<7;i++){
const d=dataOff(i);
const vs=db.vendas.filter(v=>v.data===d);
const q=vs.reduce((a,v)=>a+v.qtd,0),t=vs.reduce((a,v)=>a+totalV(v),0);
h+='<div class="dia"><span>'+fd(d)+(i===0?' (hoje)':'')+'</span><span>'+q+' · '+brl(t)+'</span></div>';
}
$('dias').innerHTML=h;
}

function renderVendas(){
const b=$('busca').value.trim().toLowerCase(),f=$('filtro').value;
let l=db.vendas.slice().sort((a,c)=>c.data.localeCompare(a.data)||c.ts-a.ts);
l=l.filter(v=>(!b||v.cliente.toLowerCase().includes(b)||(v.obs||'').toLowerCase().includes(b))&&(!f||(f==='pend'?faltaV(v)>0:faltaV(v)<=0)));
if(!l.length){$('listaVendas').innerHTML='<div class="vazio">Nenhuma venda aqui.</div>';return}
$('listaVendas').innerHTML=l.map(v=>{
const fa=faltaV(v);
const pg=v.pags.map(p=>'<div class="pag">'+fd(p.data)+': '+brl(p.valor)+'<span onclick="delPag(\''+v.id+'\',\''+p.id+'\')">✕</span></div>').join('');
return '<div class="card"><div class="top"><b>'+esc(v.cliente)+'</b><span class="tag '+(fa>0?'pend':'ok')+'">'+(fa>0?'Falta '+brl(fa):'Pago ✔')+'</span></div>'+
'<small>'+fd(v.data)+'</small>'+
'<div>'+v.qtd+' × '+brl(v.preco)+' = <b>'+brl(totalV(v))+'</b></div>'+
'<div>Recebido: <b class="ok-t">'+brl(pagoV(v))+'</b></div>'+
(v.obs?'<small>📝 '+esc(v.obs)+'</small>':'')+pg+
'<div class="row">'+(fa>0?'<button class="btn green sm" onclick="receber(\''+v.id+'\')">Receber</button>':'')+
'<button class="btn red sm" onclick="delVenda(\''+v.id+'\')">Excluir</button></div></div>';
}).join('');
}function renderPegas(){
const s=stats();
$('estCard').innerHTML='<small>Em estoque agora</small><b class="v" style="font-size:32px">'+s.estoque+'</b><small>Peguei '+s.pegas+' · Vendi '+s.vendidas+' · Vale '+brl(s.estoqueValor)+'</small>';
const l=db.pegas.slice().sort((a,c)=>c.data.localeCompare(a.data)||c.ts-a.ts);
if(!l.length){$('listaPegas').innerHTML='<div class="vazio">Nenhuma retirada registrada.</div>';return}
$('listaPegas').innerHTML=l.map(p=>'<div class="card"><div class="top"><b>'+p.qtd+' cocadas</b><small>'+fd(p.data)+'</small></div><div>'+p.qtd+' × '+brl(p.preco)+' = <b>'+brl(p.qtd*p.preco)+'</b></div><button class="btn red sm" onclick="delPega(\''+p.id+'\')">Excluir</button></div>').join('');
}

function renderClientes(){
const m={};
db.vendas.forEach(v=>{
const k=v.cliente.trim().toLowerCase();
if(!m[k])m[k]={nome:v.cliente,qtd:0,total:0,pago:0,n:0,ult:''};
const c=m[k];c.qtd+=v.qtd;c.total+=totalV(v);c.pago+=pagoV(v);c.n++;if(v.data>c.ult)c.ult=v.data;
});
cliCache=Object.values(m).map(c=>{c.falta=r2(c.total-c.pago);return c}).sort((a,b)=>b.falta-a.falta||b.total-a.total);
$('listaClientes').innerHTML=cliCache.map(c=>'<option value="'+esc(c.nome)+'">').join('');
if(!cliCache.length){$('listaClientesCards').innerHTML='<div class="vazio">Nenhum cliente ainda.</div>';return}
$('listaClientesCards').innerHTML=cliCache.map((c,i)=>'<div class="card"><div class="top"><b>'+esc(c.nome)+'</b><span class="tag '+(c.falta>0?'pend':'ok')+'">'+(c.falta>0?'Deve '+brl(c.falta):'Em dia ✔')+'</span></div>'+
'<div>'+c.qtd+' cocadas em '+c.n+' compra(s)</div><div>Total: <b>'+brl(c.total)+'</b> · Pago: <b class="ok-t">'+brl(c.pago)+'</b></div><small>Última compra: '+fd(c.ult)+'</small>'+
(c.falta>0?'<button class="btn gray sm" onclick="cobrar('+i+')">Copiar cobrança</button>':'')+'</div>').join('');
}

function render(){renderCards();renderDias();renderVendas();renderPegas();renderClientes();calcPrev()}

function aba(id,btn){
document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
$(id).classList.add('on');btn.classList.add('on');window.scrollTo(0,0);
}

function calcPrev(){
const q=Math.floor(num($('vQtd').value)),p=num($('vPreco').value),g=num($('vPago').value);
const t=r2(q*p);
$('prev').innerHTML=q>0?'Total: '+brl(t)+' · Falta: '+brl(Math.max(0,t-g)):'';
}
function pagouTudo(){$('vPago').value=r2(num($('vQtd').value)*num($('vPreco').value))||'';calcPrev()}

function addVenda(){
const cli=$('vCliente').value.trim(),qtd=Math.floor(num($('vQtd').value)),preco=num($('vPreco').value),pago=num($('vPago').value),data=$('vData').value||hoje();
if(!cli)return alert('Digite para quem você vendeu.');
if(qtd<=0)return alert('Digite a quantidade vendida.');
if(preco<=0)return alert('Digite o valor de cada cocada.');
const est=stats().estoque;
if(qtd>est&&!confirm('Você só tem '+est+' no estoque. Registrar mesmo assim?'))return;
const total=r2(qtd*preco);
if(pago>total)return alert('O valor pago é maior que o total ('+brl(total)+').');
const v={id:uid(),ts:Date.now(),data:data,cliente:cli,qtd:qtd,preco:preco,obs:$('vObs').value.trim(),pags:[]};
if(pago>0)v.pags.push({id:uid(),data:data,valor:pago});
db.vendas.push(v);salvar();
['vCliente','vQtd','vPago','vObs'].forEach(i=>$(i).value='');
render();
}

function receber(id){
const v=db.vendas.find(x=>x.id===id);if(!v)return;
const f=faltaV(v);
const r=prompt('Quanto recebeu de '+v.cliente+'? (falta '+brl(f)+')',String(f).replace('.',','));
if(r===null)return;
const val=r2(num(r));
if(val<=0)return;
if(val>f)return alert('O valor é maior do que falta ('+brl(f)+').');
v.pags.push({id:uid(),data:hoje(),valor:val});salvar();render();
}
function delPag(vid,pid){
const v=db.vendas.find(x=>x.id===vid);if(!v||!confirm('Remover este pagamento?'))return;
v.pags=v.pags.filter(p=>p.id!==pid);salvar();render();
}
function delVenda(id){
if(!confirm('Excluir esta venda? As cocadas voltam para o estoque.'))return;
db.vendas=db.vendas.filter(v=>v.id!==id);salvar();render();
}

function addPega(){
const qtd=Math.floor(num($('pQtd').value)),preco=num($('pPreco').value),data=$('pData').value||hoje();
if(qtd<=0)return alert('Digite a quantidade.');
if(preco<=0)return alert('Digite o valor de cada cocada.');
db.pegas.push({id:uid(),ts:Date.now(),data:data,qtd:qtd,preco:preco});
salvar();$('pQtd').value='';render();
}
function delPega(id){
const p=db.pegas.find(x=>x.id===id);if(!p)return;
if(stats().estoque-p.qtd<0&&!confirm('O estoque ficará negativo. Excluir mesmo assim?'))return;
if(!confirm('Excluir esta retirada?'))return;
db.pegas=db.pegas.filter(x=>x.id!==id);salvar();render();
}

function setPreco(){
db.preco=num($('precoPadrao').value)||12;salvar();
$('vPreco').value=db.preco;$('pPreco').value=db.preco;render();
}
function cobrar(i){
const c=cliCache[i];
const t='Oi '+c.nome+'! Passando para lembrar das cocadas: falta '+brl(c.falta)+'. Obrigado! 🥥';
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>alert('Mensagem copiada!')).catch(()=>prompt('Copie a mensagem:',t));
else prompt('Copie a mensagem:',t);
}

function gerarBackup(){
const t=JSON.stringify(db);$('bk').value=t;$('bk').select();
try{document.execCommand('copy')}catch(e){}
alert('Backup gerado. Guarde esse texto em um lugar seguro.');
}
function restaurar(){
try{
const d=JSON.parse($('bk').value);
if(!d||!Array.isArray(d.pegas)||!Array.isArray(d.vendas))throw 0;
if(!confirm('Isso substitui todos os dados atuais. Continuar?'))return;
db=d;if(!db.preco)db.preco=12;salvar();init();alert('Dados restaurados!');
}catch(e){alert('Backup inválido. Cole o texto completo.')}
}
function limparTudo(){
if(!confirm('Apagar TODOS os registros?')||!confirm('Tem certeza? Não dá para desfazer.'))return;
db={preco:12,pegas:[],vendas:[]};salvar();init();
}

function init(){
$('vData').value=hoje();$('pData').value=hoje();
$('precoPadrao').value=db.preco;$('vPreco').value=db.preco;$('pPreco').value=db.preco;
render();
}
init();
</script>
</body>
</html>
